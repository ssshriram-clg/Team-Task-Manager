<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2-Member Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 12px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #eee; margin: 5px 0; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Group Project Tasks</h2>
        <input type="text" id="taskInput" placeholder="Enter new task...">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/tasks';

        // Load tasks from Laptop 1's server
        async function fetchTasks() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            data.forEach(task => {
                const li = document.createElement('li');
                li.textContent = task.text;
                list.appendChild(li);
            });
        }

        // Send new task to Laptop 1's server
        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: input.value })
            });

            input.value = '';
            fetchTasks(); // Refresh list
        }

        // Fetch on load
        fetchTasks();
    </script>
</body>
</html>
